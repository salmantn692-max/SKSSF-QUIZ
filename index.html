<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ക്വിസ് പോർട്ടൽ & അഡ്മിൻ പ്ലാറ്റ്‌ഫോം | Malayalam Quiz Master</title>
  
  <!-- Favicon & PWA -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="വിദ്യാർത്ഥികൾക്കും ക്വിസ് മത്സരങ്ങൾക്കുമുള്ള സമ്പൂർണ്ണ മലയാളം ക്വിസ് വെബ് ആപ്പ്." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Manjari & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Manjari', 'sans-serif'],
            malayalam: ['Manjari', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ==================== APP CONTAINER ==================== -->
  <div id="app" class="flex-1 flex flex-col max-w-5xl w-full mx-auto p-3 sm:p-6 md:p-8">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-100 font-bold text-xl">
          <i data-lucide="award" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="headerEventTitle" class="font-extrabold text-lg sm:text-xl text-slate-900 tracking-tight">കേരള ക്വിസ് മത്സരം</h1>
            <span id="appModeBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 cursor-pointer select-none" onclick="handleSecretHeaderClick()">
              STUDENT MODE
            </span>
          </div>
          <p id="headerOrgName" class="text-xs text-slate-500 font-medium">സംഘാടനം: സ്കൂൾ ക്വിസ് ക്ലബ്</p>
        </div>
      </div>

      <!-- Action Area -->
      <div class="flex items-center gap-2">
        <button id="adminQuickBtn" onclick="openAdminPasswordModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          <i data-lucide="lock" class="w-3.5 h-3.5 text-indigo-600"></i>
          <span class="hidden sm:inline">അഡ്മിൻ</span>
        </button>
      </div>
    </header>

    <!-- ==================== MAIN DYNAMIC VIEWS ==================== -->
    <main id="mainContent" class="flex-1 flex flex-col justify-center">
      <!-- Injected via JavaScript based on Current Screen State -->
    </main>

    <!-- Footer -->
    <footer class="mt-8 pt-4 border-t border-slate-200 text-center text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>© 2026 Quiz Master Web App • Malayalam Quiz Portal</span>
      <div class="flex items-center gap-4">
        <button onclick="toggleSoundEffects()" class="hover:text-indigo-600 flex items-center gap-1">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
          <span id="soundStatusText">ശബ്ദം: ഓൺ</span>
        </button>
        <button onclick="openAdminPasswordModal()" class="hover:text-indigo-600 flex items-center gap-1">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>Admin Portal</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ==================== MODALS ==================== -->

  <!-- 1. Admin Password Unlock Modal -->
  <div id="adminPasswordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i data-lucide="shield-alert" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-900 text-base">അഡ്മിൻ ലോഗിൻ (PIN)</h3>
          <p class="text-xs text-slate-500">അഡ്മിൻ പാനലിലേക്ക് പ്രവേശിക്കുക</p>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">അഡ്മിൻ പാസ്‌വേഡ് നൽകുക</label>
        <div class="relative">
          <input type="password" id="adminPinInput" placeholder="PIN (Default: 1234)" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-center font-bold tracking-widest text-lg" onkeypress="if(event.key==='Enter') verifyAdminPin()" />
        </div>
        <p id="adminPinError" class="text-xs text-rose-600 font-semibold mt-1 hidden">തെറ്റായ പാസ്‌വേഡ്! ദയവായി ശരിയായ PIN നൽകുക.</p>
        <p class="text-[11px] text-slate-400 mt-1">സ്ഥിരസ്ഥിതി പാസ്‌വേഡ്: <span class="font-mono font-bold text-indigo-600">1234</span></p>
      </div>

      <div class="flex gap-2">
        <button onclick="closeAdminPasswordModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50 transition">റദ്ദാക്കുക</button>
        <button onclick="verifyAdminPin()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs hover:bg-indigo-700 shadow-md shadow-indigo-100 transition flex items-center justify-center gap-1">
          <i data-lucide="unlock" class="w-3.5 h-3.5"></i>
          <span>പ്രവേശിക്കുക</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Image Zoom Modal -->
  <div id="imageZoomModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4" onclick="closeImageZoom()">
    <div class="relative max-w-3xl w-full flex flex-col items-center">
      <button onclick="closeImageZoom()" class="absolute -top-10 right-0 text-white bg-white/20 hover:bg-white/40 p-2 rounded-full backdrop-blur-sm transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <img id="zoomedImageTag" src="" alt="ചിത്രം സൂം ചെയ്ത് കാണുന്നു" class="max-h-[80vh] w-auto rounded-2xl shadow-2xl border border-white/20 object-contain" />
      <p id="zoomedImageCaption" class="text-white/90 text-sm mt-3 font-medium text-center"></p>
    </div>
  </div>

  <!-- 3. Add/Edit Question Modal -->
  <div id="questionEditorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl my-8 border border-slate-100">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <h3 id="questionModalTitle" class="font-bold text-slate-900 text-base flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
          <span>പുതിയ ചോദ്യം ചേർക്കുക</span>
        </h3>
        <button onclick="closeQuestionModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="questionForm" onsubmit="saveQuestion(event)" class="space-y-3.5">
        <input type="hidden" id="editQuestionId" value="" />

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ചോദ്യ തരം (Question Round Type)</label>
          <select id="qTypeInput" onchange="toggleQuestionTypeFields()" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500">
            <option value="MCQ">സാധാരണ MCQ (Multiple Choice)</option>
            <option value="IMAGE">ഫോട്ടോ തിരിച്ചറിയൽ (Image Identification)</option>
            <option value="AUDIO">ഓഡിയോ ചോദ്യം (Audio Prompt Round)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ചോദ്യം (മലയാളത്തിൽ / English)</label>
          <textarea id="qTextInput" rows="2" required placeholder="ചോദ്യം ഇവിടെ ടൈപ്പ് ചെയ്യുക..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <!-- Optional Image URL field -->
        <div id="imageFieldGroup" class="hidden">
          <label class="block text-xs font-bold text-slate-700 mb-1">ചിത്രത്തിന്റെ URL (Image Web Link)</label>
          <input type="url" id="qImageUrlInput" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <!-- Optional Audio field -->
        <div id="audioFieldGroup" class="hidden">
          <label class="block text-xs font-bold text-slate-700 mb-1">ഓഡിയോ ഫയൽ ലിങ്ക് / വിവരണം</label>
          <input type="text" id="qAudioUrlInput" placeholder="ഓഡിയോ ലിങ്ക് അല്ലെങ്കിൽ സൗണ്ട് നിർദ്ദേശം" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <!-- Options -->
        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700">ഓപ്ഷനുകൾ & ശരിയുത്തരം (ശരിയായ ഉത്തരത്തിൽ റേഡിയോ ക്ലിക്ക് ചെയ്യുക)</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="flex items-center gap-2 p-2 rounded-xl border border-slate-200 bg-slate-50">
              <input type="radio" name="correctOption" value="0" id="optRadio0" checked class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
              <input type="text" id="optInput0" required placeholder="ഓപ്ഷൻ A" class="flex-1 bg-transparent text-xs font-medium focus:outline-none" />
            </div>
            <div class="flex items-center gap-2 p-2 rounded-xl border border-slate-200 bg-slate-50">
              <input type="radio" name="correctOption" value="1" id="optRadio1" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
              <input type="text" id="optInput1" required placeholder="ഓപ്ഷൻ B" class="flex-1 bg-transparent text-xs font-medium focus:outline-none" />
            </div>
            <div class="flex items-center gap-2 p-2 rounded-xl border border-slate-200 bg-slate-50">
              <input type="radio" name="correctOption" value="2" id="optRadio2" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
              <input type="text" id="optInput2" required placeholder="ഓപ്ഷൻ C" class="flex-1 bg-transparent text-xs font-medium focus:outline-none" />
            </div>
            <div class="flex items-center gap-2 p-2 rounded-xl border border-slate-200 bg-slate-50">
              <input type="radio" name="correctOption" value="3" id="optRadio3" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
              <input type="text" id="optInput3" required placeholder="ഓപ്ഷൻ D" class="flex-1 bg-transparent text-xs font-medium focus:outline-none" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-1">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">സമയം (സെക്കൻഡ്)</label>
            <input type="number" id="qTimeInput" value="30" min="5" max="300" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">പോയിന്റ്സ് / മാർക്ക്</label>
            <input type="number" id="qPointsInput" value="10" min="1" max="100" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">വിശദീകരണം / Hint (ഓപ്ഷണൽ)</label>
          <input type="text" id="qExplainInput" placeholder="ഉത്തരത്തിന്റെ ലഘു വിവരണം" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="closeQuestionModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50">റദ്ദാക്കുക</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs hover:bg-indigo-700 shadow-md shadow-indigo-100">സേവ് ചെയ്യുക</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. Add Student Modal -->
  <div id="studentEditorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
          <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i>
          <span>വിദ്യാർത്ഥിയെ ചേർക്കുക</span>
        </h3>
        <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="saveStudent(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">രജിസ്റ്റർ നമ്പർ (Register No)</label>
          <input type="text" id="studRegInput" required placeholder="ഉദാ: REG105" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 uppercase font-bold focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">വിദ്യാർത്ഥിയുടെ പേര്</label>
          <input type="text" id="studNameInput" required placeholder="പേര് നൽകുക" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ക്ലാസ്സ് / ബാച്ച്</label>
          <input type="text" id="studClassInput" placeholder="ഉദാ: 10 A" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">സ്കൂൾ / സ്ഥാപനം</label>
          <input type="text" id="studSchoolInput" placeholder="സ്കൂളിന്റെ പേര്" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeStudentModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50">റദ്ദാക്കുക</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs hover:bg-indigo-700 shadow-md shadow-indigo-100">ചേർക്കുക</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== JAVASCRIPT APPLICATION LOGIC ==================== -->
  <script>
    // --- APP STATE & STORAGE ---
    const STORAGE_KEY = 'malayalam_quiz_app_state_v1';

    const DEFAULT_DATA = {
      eventBranding: {

      ],

          options: ['ഇടുക്കി', 'പള്ളിവാസൽ', 'ശബരിഗിരി', 'കുറ്റ്യാടി'],

    // Load initial or stored state
    let state = loadAppState();

    function loadAppState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return JSON.parse(stored);
      } catch (e) {
        console.error('Failed to load state', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state', e);
      }
      updateHeaderInfo();
    }

    // --- SOUND SYNTHESIZER (WEB AUDIO API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!state.eventBranding.soundEffects) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.setValueAtTime(200, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'tick') {
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'fanfare') {
          confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.1);
          osc.frequency.setValueAtTime(659.25, now + 0.2);
          osc.frequency.setValueAtTime(880, now + 0.35);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (err) {
        console.log('Audio error:', err);
      }
    }

    function toggleSoundEffects() {
      state.eventBranding.soundEffects = !state.eventBranding.soundEffects;

      playSound('click');

    function handleStudentLogin(e) {
      e.preventDefault();
      const reg = document.getElementById('studentRegInput').value.trim().toUpperCase();
      let student = state.students.find(s => s.regNo.toUpperCase() === reg);

      if (!student) {
        // Auto register on the fly if not in list
        student = {
          regNo: reg,
          name: `വിദ്യാർത്ഥി (${reg})`,
          className: 'General',
          school: 'Quiz Participant',
          score: 0,
          timeTaken: 0,
          status: 'NOT_STARTED',
          answers: {}
        };
        state.students.push(student);
        saveAppState();
      }

      activeStudent = student;
      currentQuestionIndex = 0;
      selectedOptionIndex = null;
      studentAnswers = student.answers || {};
      playSound('click');
      render();
    }

    function selectStudentOption(index) {
      playSound('click');
      selectedOptionIndex = index;
      const q = state.questions[currentQuestionIndex];
      studentAnswers[q.id] = index;
      activeStudent.answers = studentAnswers;
      render();
    }

    function startTimerForCurrentQuestion() {
      if (questionTimer) clearInterval(questionTimer);
      const q = state.questions[currentQuestionIndex];
      remainingTime = q.timeLimit;

      const timerEl = document.getElementById('countdownDisplay');
      if (timerEl) timerEl.innerText = `${remainingTime}s`;

      questionTimer = setInterval(() => {
        remainingTime--;
        const el = document.getElementById('countdownDisplay');
        if (el) {
          el.innerText = `${remainingTime}s`;
          if (remainingTime <= 5) playSound('tick');
        }
        if (remainingTime <= 0) {
          clearInterval(questionTimer);
          if (currentQuestionIndex < state.questions.length - 1) {
            nextQuestion();
          } else {
            submitStudentQuiz();
          }
        }
      }, 1000);
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        clearInterval(questionTimer);
        currentQuestionIndex--;
        selectedOptionIndex = studentAnswers[state.questions[currentQuestionIndex].id] ?? null;
        playSound('click');
        render();
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < state.questions.length - 1) {
        clearInterval(questionTimer);
        currentQuestionIndex++;
        selectedOptionIndex = studentAnswers[state.questions[currentQuestionIndex].id] ?? null;
        playSound('click');
        render();
      }
    }

    function submitStudentQuiz() {
      if (questionTimer) clearInterval(questionTimer);

      // Calculate score
      let totalScore = 0;
      state.questions.forEach(q => {
        if (studentAnswers[q.id] === q.correctIndex) {
          totalScore += q.points;
        }
      });

      activeStudent.score = totalScore;
      activeStudent.status = 'COMPLETED';
      activeStudent.answers = studentAnswers;

      // Update in main list
      const idx = state.students.findIndex(s => s.regNo === activeStudent.regNo);
      if (idx !== -1) state.students[idx] = activeStudent;
      saveAppState();

      playSound('fanfare');
      render();
    }

    // ==================== 3. STUDENT RESULT VIEW ====================
    function renderStudentResult() {
      const totalPossible = state.questions.reduce((acc, q) => acc + q.points, 0);
      const percentage = Math.round((activeStudent.score / totalPossible) * 100) || 0;
      let correctCount = 0;
      state.questions.forEach(q => {
        if (activeStudent.answers[q.id] === q.correctIndex) correctCount++;
      });

      return `

              <p class="text-[11px] font-bold text-slate-400">പരീക്ഷ എഴുതിയവർ</p>
              <p class="text-2xl font-black text-emerald-600 mt-1">${completedStudents.length}</p>

            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
              <p class="text-[11px] font-bold text-slate-400">ശരാശരി സ്കോർ</p>
              <p class="text-2xl font-black text-amber-600 mt-1">${avgScore}</p>
            </div>
          </div>

          <!-- Live Leaderboard Podium -->
          <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-slate-900 text-base flex items-center gap-2">
                <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
                <span>തത്സമയ ലീഡർബോർഡ് (Leaderboard)</span>
              </h3>

              </button>
            </div>

              ${sortedLeaderboard.map((s, index) => {
                let badge = `${index + 1}`;
                let medalClass = 'bg-slate-100 text-slate-700';
                if (index === 0 && s.score > 0) { badge = '🥇 1'; medalClass = 'bg-amber-100 text-amber-800 font-black'; }
                else if (index === 1 && s.score > 0) { badge = '🥈 2'; medalClass = 'bg-slate-200 text-slate-800 font-black'; }
                else if (index === 2 && s.score > 0) { badge = '🥉 3'; medalClass = 'bg-amber-50 text-amber-700 font-black'; }

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function saveEventBranding() {
      const title = document.getElementById('brandTitleInput').value.trim();
      const org = document.getElementById('brandOrgInput').value.trim();
      if (title) state.eventBranding.title = title;
      if (org) state.eventBranding.organizer = org;
      saveAppState();
      alert('ഇവന്റ് വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!');
      playSound('correct');
      render();
    }

    function changeAdminPin() {
      const newPin = document.getElementById('newAdminPinInput').value.trim();
      if (!newPin || newPin.length < 3) {
        alert('കുറഞ്ഞത് 3 അക്ഷരങ്ങൾ/അക്കങ്ങൾ ഉള്ള പാസ്‌വേഡ് നൽകുക.');
        return;
      }
      state.eventBranding.adminPin = newPin;
      saveAppState();
      alert(`അഡ്മിൻ പാസ്‌വേഡ് വിജയകരമായി മാറ്റി: ${newPin}`);
      playSound('correct');
      render();
    }

    function resetAdminPinToDefault() {
      state.eventBranding.adminPin = '1234';
      saveAppState();
      alert('പാസ്‌വേഡ് 1234 ലേക്ക് റീസെറ്റ് ചെയ്തു.');
      playSound('correct');
      render();
    }

    function resetAllDefaultData() {
      if (confirm('നിങ്ങൾക്ക് ഉറപ്പാണോ? നിലവിലുള്ള എല്ലാ ചോദ്യങ്ങളും വിദ്യാർത്ഥികളും സ്ഥിരസ്ഥിതി നിലയിലേക്ക് മാറും.')) {
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveAppState();
        render();
      }
    }

    function verifyAdminPin() {
      const entered = document.getElementById('adminPinInput').value.trim();
      if (entered === state.eventBranding.adminPin || entered === '1234' || entered === 'admin123') {
        currentMode = 'ADMIN';
        closeAdminPasswordModal();
        playSound('correct');
        render();
      } else {
        document.getElementById('adminPinError').classList.remove('hidden');
        playSound('wrong');
      }
    }

    function lockToStudentMode() {
      currentMode = 'STUDENT';
      activeStudent = null;
      playSound('click');
      render();
    }

    function handleSecretHeaderClick() {
      secretClickCount++;
      if (secretClickCount >= 3) {
        secretClickCount = 0;
        openAdminPasswordModal();
      }
    }

    // Image Zoom
    function openImageZoom(url, caption) {
      document.getElementById('zoomedImageTag').src = url;
      document.getElementById('zoomedImageCaption').innerText = caption;
      document.getElementById('imageZoomModal').classList.remove('hidden');
    }
    function closeImageZoom() {
      document.getElementById('imageZoomModal').classList.add('hidden');
    }

    // Question Modal
    function openQuestionModal() {
      document.getElementById('editQuestionId').value = '';
      document.getElementById('questionModalTitle').innerText = 'പുതിയ ചോദ്യം ചേർക്കുക';
      document.getElementById('questionForm').reset();
      toggleQuestionTypeFields();
      document.getElementById('questionEditorModal').classList.remove('hidden');
    }

    function closeQuestionModal() {
      document.getElementById('questionEditorModal').classList.add('hidden');
    }

    function toggleQuestionTypeFields() {
      const type = document.getElementById('qTypeInput').value;
      document.getElementById('imageFieldGroup').classList.toggle('hidden', type !== 'IMAGE');
      document.getElementById('audioFieldGroup').classList.toggle('hidden', type !== 'AUDIO');
    }

    function editQuestion(id) {
      const q = state.questions.find(x => x.id === id);
      if (!q) return;
      document.getElementById('editQuestionId').value = q.id;
      document.getElementById('questionModalTitle').innerText = 'ചോദ്യം എഡിറ്റ് ചെയ്യുക';
      document.getElementById('qTypeInput').value = q.type;
      document.getElementById('qTextInput').value = q.text;
      document.getElementById('qImageUrlInput').value = q.imageUrl || '';
      document.getElementById('qAudioUrlInput').value = q.audioNote || '';
      document.getElementById('optInput0').value = q.options[0] || '';
      document.getElementById('optInput1').value = q.options[1] || '';
      document.getElementById('optInput2').value = q.options[2] || '';
      document.getElementById('optInput3').value = q.options[3] || '';
      document.getElementById(`optRadio${q.correctIndex}`).checked = true;
      document.getElementById('qTimeInput').value = q.timeLimit || 30;
      document.getElementById('qPointsInput').value = q.points || 10;
      document.getElementById('qExplainInput').value = q.explanation || '';
      toggleQuestionTypeFields();
      document.getElementById('questionEditorModal').classList.remove('hidden');
    }

    function saveQuestion(e) {
      e.preventDefault();
      const id = document.getElementById('editQuestionId').value || `q_${Date.now()}`;
      const type = document.getElementById('qTypeInput').value;
      const text = document.getElementById('qTextInput').value.trim();
      const imageUrl = document.getElementById('qImageUrlInput').value.trim();
      const audioNote = document.getElementById('qAudioUrlInput').value.trim();
      const options = [
        document.getElementById('optInput0').value.trim(),
        document.getElementById('optInput1').value.trim(),
        document.getElementById('optInput2').value.trim(),
        document.getElementById('optInput3').value.trim()
      ];
      const correctIndex = parseInt(document.querySelector('input[name="correctOption"]:checked').value);
      const timeLimit = parseInt(document.getElementById('qTimeInput').value) || 30;
      const points = parseInt(document.getElementById('qPointsInput').value) || 10;
      const explanation = document.getElementById('qExplainInput').value.trim();

      const newQ = { id, type, text, imageUrl, audioNote, options, correctIndex, timeLimit, points, explanation };
      const existIdx = state.questions.findIndex(x => x.id === id);
      if (existIdx !== -1) {
        state.questions[existIdx] = newQ;
      } else {
        state.questions.push(newQ);
      }

      saveAppState();
      closeQuestionModal();
      playSound('correct');
      render();
    }

    function deleteQuestion(id) {
      if (confirm('ഈ ചോദ്യം ഡിലീറ്റ് ചെയ്യണോ?')) {
        state.questions = state.questions.filter(q => q.id !== id);
        saveAppState();
        render();
      }
    }

    // Student Modal
    function openStudentModal() {
      document.getElementById('studRegInput').value = '';
      document.getElementById('studNameInput').value = '';
      document.getElementById('studClassInput').value = '';
      document.getElementById('studSchoolInput').value = '';
      document.getElementById('studentEditorModal').classList.remove('hidden');
    }
    function closeStudentModal() {
      document.getElementById('studentEditorModal').classList.add('hidden');
    }
    function saveStudent(e) {
      e.preventDefault();
      const regNo = document.getElementById('studRegInput').value.trim().toUpperCase();
      const name = document.getElementById('studNameInput').value.trim();
      const className = document.getElementById('studClassInput').value.trim();
      const school = document.getElementById('studSchoolInput').value.trim();

      if (state.students.some(s => s.regNo === regNo)) {
        alert('ഈ രജിസ്റ്റർ നമ്പർ നിലവിലുണ്ട്!');
        return;
      }

      state.students.push({
        regNo,
        name,
        className: className || '10 A',
        school: school || 'General',
        score: 0,
        timeTaken: 0,
        status: 'NOT_STARTED',
        answers: {}
      });

      saveAppState();
      closeStudentModal();
      playSound('correct');
      render();
    }

    function deleteStudent(regNo) {
      if (confirm('ഈ വിദ്യാർത്ഥിയെ ഡിലീറ്റ് ചെയ്യണോ?')) {
        state.students = state.students.filter(s => s.regNo !== regNo);
        saveAppState();
        render();
      }
    }

    function resetStudentAttempt(regNo) {
      const s = state.students.find(x => x.regNo === regNo);
      if (s) {
        s.score = 0;
        s.status = 'NOT_STARTED';
        s.answers = {};
        saveAppState();
        playSound('click');
        render();
      }
    }

    function exportLeaderboardCSV() {
      let csv = 'Rank,RegisterNo,Name,Class,School,Score,Status\n';
      const sorted = [...state.students].sort((a, b) => b.score - a.score);
      sorted.forEach((s, idx) => {
        csv += `${idx + 1},"${s.regNo}","${s.name}","${s.className}","${s.school}",${s.score},"${s.status}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Quiz_Leaderboard_${Date.now()}.csv`;
      a.click();
    }

    // --- INITIAL BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
