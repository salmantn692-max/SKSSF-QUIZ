<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>നൂറിന്‍ പ്രഭ · Quiz Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&family=Baloo+Chettan+2:wght@500;600;700;800&family=Chilanka&family=Gayathri:wght@400;700&family=Manjari:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --grad: radial-gradient(120% 90% at 15% 0%, #f0895f 0%, #e8628b 32%, #ac388f 58%, #5a2178 78%, #3a1a5c 100%);
    --yellow: #f6e24a;
    --yellow-ink: #4a3c05;
    --white: #ffffff;
    --ink: #2a1330;
    --muted: rgba(255,255,255,0.72);
    --green: #2fa860;
    --red: #d9534f;
    --radius: 999px;
    --shadow: 0 10px 30px rgba(30,10,50,0.35);
    --font-display: 'Baloo Chettan 2', 'Noto Sans Malayalam', sans-serif;
    --font-body: 'Gayathri', 'Noto Sans Malayalam', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--grad);
    font-family:var(--font-body);
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:40px 24px 28px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:800;
    color:var(--white);
    font-size:clamp(38px, 11vw, 56px);
    line-height:1;
    margin:0;
    text-shadow:0 4px 18px rgba(0,0,0,0.18);
  }
  .brand p{
    font-family:var(--font-display);
    font-weight:600;
    color:var(--muted);
    font-size:clamp(15px, 4vw, 19px);
    margin:8px 0 0;
    letter-spacing:0.3px;
  }
  .quiz-title{
    text-align:center;
    color:var(--white);
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:clamp(24px, 6.4vw, 30px);
    margin:22px 0 20px;
  }
  .progress{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:18px;
  }
  .progress .dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,0.32);
    transition:background 0.25s, transform 0.25s;
  }
  .progress .dot.active{background:var(--white); transform:scale(1.25);}
  .progress .dot.done{background:var(--yellow);}
  .card-stack{flex:1; display:flex; flex-direction:column;}
  .q-card-wrap{position:relative;}
  .q-pill{
    background:var(--yellow);
    color:var(--yellow-ink);
    border-radius:28px;
    padding:22px 22px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(16px,4.6vw,18px);
    line-height:1.45;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    animation:pop-in 0.35s ease;
  }
  .timer-badge{position:absolute; top:-14px; right:-8px; width:52px; height:52px;}
  .timer-badge svg{position:absolute; inset:0; transform:rotate(-90deg);}
  .timer-badge circle.bg-fill{fill:#2a1330; fill-opacity:0.55; stroke:none;}
  .timer-badge circle.track{fill:none; stroke:rgba(255,255,255,0.3); stroke-width:5;}
  .timer-badge circle.fg{fill:none; stroke:#ffffff; stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 0.9s linear;}
  .timer-badge .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; color:#fff;}
  .timer-badge.low circle.fg{stroke:var(--red);}
  .timer-badge.low .num{color:#ffb3b1;}
  @keyframes pop-in{from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .options{display:flex; flex-direction:column; gap:16px;}
  .opt{
    background:var(--white);
    border:none;
    border-radius:26px;
    padding:18px 22px;
    text-align:left;
    font-family:inherit;
    font-size:clamp(15px,4.2vw,17px);
    font-weight:700;
    color:var(--ink);
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:transform 0.15s, background 0.2s, color 0.2s;
  }
  .opt .letter{font-weight:800; font-family:var(--font-display);}
  .opt:hover:not(:disabled){transform:translateY(-1px);}
  .opt:active:not(:disabled){transform:translateY(0px) scale(0.99);}
  .opt:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--green); color:#fff;}
  .opt.wrong{background:var(--red); color:#fff;}
  .opt.dim{opacity:0.55;}
  .next-wrap{margin-top:22px; display:flex; justify-content:center;}
  .btn{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius:var(--radius);
    padding:13px 30px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .btn-light{background:var(--white); color:var(--ink);}
  .btn-primary{background:var(--yellow); color:var(--yellow-ink);}
  .btn-ghost{background:rgba(255,255,255,0.16); color:var(--white); box-shadow:none; border:1px solid rgba(255,255,255,0.4);}
  .btn-outline{background:transparent; color:var(--ink); box-shadow:none; border:1px solid #ccc;}
  .footer{
    text-align:center;
    margin-top:auto;
    padding-top:30px;
  }
  .footer .club{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--white);
    font-size:clamp(20px,5.6vw,26px);
  }
  .admin-link{
    display:block;
    text-align:center;
    margin-top:14px;
    color:rgba(255,255,255,0.55);
    font-size:12px;
    text-decoration:none;
    font-family:'Poppins',sans-serif;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .admin-link:hover{color:rgba(255,255,255,0.85);}

  /* End screen */
  .end-card{
    background:rgba(255,255,255,0.94);
    border-radius:28px;
    padding:30px 24px;
    text-align:center;
    box-shadow:var(--shadow);
    animation:pop-in 0.35s ease;
  }
  .end-card h2{font-family:var(--font-display); margin:0 0 6px; font-size:24px;}
  .end-card .score{font-size:44px; font-weight:800; font-family:var(--font-display); color:#7a2e8c; margin:10px 0;}
  .end-card input{
    width:100%; padding:13px 16px; border-radius:16px; border:1px solid #ddd;
    font-family:inherit; font-size:15px; margin:14px 0; text-align:center;
  }
  .end-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px;}

  /* Loading / empty */
  .center-note{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--white); text-align:center; font-weight:500; padding:20px;
  }

  /* Admin overlay */
  .overlay{
    position:fixed; inset:0; background:#241033; z-index:50;
    overflow-y:auto;
    display:flex; justify-content:center;
  }
  .overlay-inner{width:100%; max-width:560px; padding:28px 20px 60px; color:#fff;}
  .lock-box{
    margin-top:18vh; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
    border-radius:20px; padding:28px 24px; text-align:center;
  }
  .lock-box h3{font-family:var(--font-display); margin-top:0;}
  .lock-box input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08); color:#fff; font-size:15px; margin:14px 0; text-align:center;
  }
  .lock-box input::placeholder{color:rgba(255,255,255,0.5);}
  .lock-err{color:#ff9b9b; font-size:13px; min-height:18px;}

  .admin-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .admin-header h2{font-family:var(--font-display); margin:0; font-size:22px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .tab{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff;
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:'Poppins',sans-serif;
  }
  .tab.active{background:var(--yellow); color:var(--yellow-ink); border-color:transparent; font-weight:600;}

  .q-item{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    border-radius:16px; padding:16px; margin-bottom:12px;
  }
  .q-item .qt{font-weight:600; margin-bottom:8px; line-height:1.4;}
  .q-item .opt-row{font-size:13.5px; padding:4px 0; color:rgba(255,255,255,0.85); display:flex; gap:6px;}
  .q-item .opt-row.correct{color:#8ff0b0; font-weight:600;}
  .q-item .row-actions{display:flex; gap:8px; margin-top:10px;}
  .mini-btn{
    font-size:12.5px; padding:7px 13px; border-radius:999px; border:none; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:600;
  }
  .mini-edit{background:rgba(255,255,255,0.14); color:#fff;}
  .mini-del{background:rgba(217,83,79,0.22); color:#ffb3b1;}

  .form-box{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    border-radius:16px; padding:18px; margin-top:6px;
  }
  .form-box label{display:block; font-size:12.5px; color:rgba(255,255,255,0.6); margin:10px 0 4px;}
  .form-box label:first-child{margin-top:0;}
  .form-box input[type=text], .form-box textarea, .form-box select{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.07); color:#fff; font-family:inherit; font-size:14.5px; resize:vertical;
  }
  .form-box select option{ background:#241033; color:#fff; }
  .radio-row{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .radio-row input{width:auto;}
  .radio-row label{margin:0; font-size:13.5px; color:#fff;}
  .form-actions{display:flex; gap:10px; margin-top:16px;}

  table.lb{width:100%; border-collapse:collapse; font-size:14px;}
  table.lb th{text-align:left; padding:8px; color:rgba(255,255,255,0.55); font-weight:500; font-size:12px; border-bottom:1px solid rgba(255,255,255,0.15);}
  table.lb td{padding:9px 8px; border-bottom:1px solid rgba(255,255,255,0.08);}
  .empty-note{color:rgba(255,255,255,0.55); font-size:14px; padding:18px 0; text-align:center;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1c1c1c; color:#fff; padding:10px 20px; border-radius:999px; font-size:13.5px;
    z-index:100; opacity:0; pointer-events:none; transition:opacity 0.25s, bottom 0.25s;
  }
  .toast.show{opacity:1; bottom:34px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  var STORAGE_KEY = 'quiz-data-noorin-prabha';
  var LB_KEY = 'leaderboard-noorin-prabha';
  var ADMIN_PASS = 'skssf2026';

  var FONT_PRESETS = {
    rounded: {
      label: 'Rounded & Bold',
      display: "'Baloo Chettan 2','Noto Sans Malayalam',sans-serif",
      body: "'Gayathri','Noto Sans Malayalam',sans-serif"
    },
    classic: {
      label: 'Classic & Elegant',
      display: "'Manjari','Noto Sans Malayalam',sans-serif",
      body: "'Manjari','Noto Sans Malayalam',sans-serif"
    },
    handwritten: {
      label: 'Handwritten & Warm',
      display: "'Chilanka','Noto Sans Malayalam',sans-serif",
      body: "'Noto Sans Malayalam',sans-serif"
    },
    modern: {
      label: 'Modern & Minimal',
      display: "'Anek Malayalam','Noto Sans Malayalam',sans-serif",
      body: "'Anek Malayalam','Noto Sans Malayalam',sans-serif"
    }
  };

  var defaultData = {
    config: {
      title: 'നൂറിന്‍ പ്രഭ',
      subtitle: 'മീലാദ് ക്യാമ്പയിൽ 2026',
      footer: 'SKSSF Campus wing 2026-27',
      timePerQuestion: 15,
      fontPreset: 'rounded'
    },
    questions: [
      { id: 'q1', text: 'നബി ﷺ തങ്ങളുടെ മാതാവ് മരണപ്പെട്ട സ്ഥലം ഏത്?', options: ['മക്ക', 'അബ്‌വാഅ്', 'മദീന'], correct: 1 },
      { id: 'q2', text: 'നബി ﷺ യുടെ പിതാവിന്റെ പേര് എന്ത്?', options: ['അബ്ദുല്ല', 'അബൂത്വാലിബ്', 'അബ്ദുൽ മുത്തലിബ്'], correct: 0 },
      { id: 'q3', text: 'നബി ﷺ യുടെ ജന്മസ്ഥലം ഏത്?', options: ['മദീന', 'മക്ക', 'ത്വാഇഫ്'], correct: 1 },
      { id: 'q4', text: 'നബി ﷺ യെ മുലയൂട്ടി വളർത്തിയ സ്ത്രീയുടെ പേര്?', options: ['ഹലീമ ബീവി', 'ആമിന ബീവി', 'ഖദീജ ബീവി'], correct: 0 },
      { id: 'q5', text: 'നബി ﷺ യുടെ ആദ്യ ഭാര്യയുടെ പേര്?', options: ['ഖദീജ ബീവി', 'ആയിഷ ബീവി', 'ഫാത്വിമ ബീവി'], correct: 0 }
    ],
    students: [
      { id: 's1', regNo: 'REG101', name: 'മുഹമ്മദ് സൽമാൻ' },
      { id: 's2', regNo: 'REG102', name: 'അഹ്മദ് റിയാസ്' },
      { id: 's3', regNo: 'REG103', name: 'ഫാത്തിമ ഷിഫാന' }
    ]
  };

  var state = {
    data: null,
    leaderboard: [],
    view: 'loading',
    qIndex: 0,
    selected: null,
    locked: false,
    score: 0,
    adminTab: 'questions',
    editingId: null,
    editingStudentId: null,
    lockError: '',
    storageOk: true,
    timerId: null,
    timeLeft: 0,
    currentStudent: null,
    loginError: ''
  };

  var TIMER_CIRC = 138.23;

  var root = document.getElementById('root');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function toast(msg){
    var t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // Cross-environment Storage (localStorage + window.storage compatibility)
  async function loadAll(){
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        var res = await window.storage.get(STORAGE_KEY, true);
        state.data = res && res.value ? JSON.parse(res.value) : null;
      } else {
        var localStr = localStorage.getItem(STORAGE_KEY);
        state.data = localStr ? JSON.parse(localStr) : null;
      }
    }catch(e){
      state.data = null;
    }
    if(!state.data){
      state.data = defaultData;
      saveData();
    }
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        var lb = await window.storage.get(LB_KEY, true);
        state.leaderboard = lb && lb.value ? JSON.parse(lb.value) : [];
      } else {
        var localLb = localStorage.getItem(LB_KEY);
        state.leaderboard = localLb ? JSON.parse(localLb) : [];
      }
    }catch(e){
      state.leaderboard = [];
    }
    if(!state.data.config.timePerQuestion) state.data.config.timePerQuestion = 15;
    if(!state.data.config.fontPreset || !FONT_PRESETS[state.data.config.fontPreset]) state.data.config.fontPreset = 'rounded';
    if(!state.data.students) state.data.students = defaultData.students;
    state.view = 'login';
    render();
  }

  async function saveData(){
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(STORAGE_KEY, JSON.stringify(state.data), true);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      return true;
    }catch(e){
      toast('Could not save — try again');
      return false;
    }
  }

  async function saveLeaderboard(){
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(LB_KEY, JSON.stringify(state.leaderboard), true);
      }
      localStorage.setItem(LB_KEY, JSON.stringify(state.leaderboard));
      return true;
    }catch(e){
      toast('Could not save result');
      return false;
    }
  }

  // ---------- Countdown timer ----------
  function stopTimer(){
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  }

  function startTimer(){
    stopTimer();
    var total = state.data.config.timePerQuestion || 15;
    state.timeLeft = total;
    updateTimerUI(total, total);
    state.timerId = setInterval(function(){
      state.timeLeft--;
      updateTimerUI(state.timeLeft, total);
      if(state.timeLeft <= 0){
        stopTimer();
        timeUp();
      }
    }, 1000);
  }

  function updateTimerUI(left, total){
    var numEl = document.getElementById('timerNum');
    var fgEl = document.getElementById('timerRingFg');
    var wrapEl = document.getElementById('timerWrap');
    if(!numEl || !fgEl) return;
    numEl.textContent = Math.max(0, left);
    var pct = total > 0 ? Math.max(0, left/total) : 0;
    fgEl.style.strokeDashoffset = (TIMER_CIRC * (1 - pct)).toFixed(2);
    if(wrapEl){ if(left <= 5) wrapEl.classList.add('low'); else wrapEl.classList.remove('low'); }
  }

  function timeUp(){
    if(state.locked) return;
    state.selected = -1;
    state.locked = true;
    render();
  }

  function timerBadgeHtml(){
    var total = state.data.config.timePerQuestion || 15;
    return '<div class="timer-badge" id="timerWrap">' +
      '<svg viewBox="0 0 52 52">' +
      '<circle class="bg-fill" cx="26" cy="26" r="24"></circle>' +
      '<circle class="track" cx="26" cy="26" r="22"></circle>' +
      '<circle class="fg" id="timerRingFg" cx="26" cy="26" r="22" stroke-dasharray="' + TIMER_CIRC + '" stroke-dashoffset="0"></circle>' +
      '</svg><span class="num" id="timerNum">' + total + '</span></div>';
  }

  // ---------- Student login ----------
  function attemptLogin(){
    var input = document.getElementById('regInput');
    var val = input && input.value.trim();
    if(!val){ state.loginError = 'Enter your register number'; render(); return; }
    var match = state.data.students.find(function(s){
      return s.regNo.trim().toLowerCase() === val.toLowerCase();
    });
    if(!match){
      // Auto register if student list is empty or allow flexible login
      if(!state.data.students || state.data.students.length === 0){
        match = { regNo: val, name: 'Student (' + val + ')' };
        state.data.students.push(match);
        saveData();
      } else {
        state.loginError = 'Register number not found. Contact the admin.'; render(); return;
      }
    }
    state.currentStudent = { regNo: match.regNo, name: match.name };
    state.loginError = '';
    state.qIndex = 0; state.selected = null; state.locked = false; state.score = 0;
    state.view = 'quiz';
    render();
  }

  function logout(){
    stopTimer();
    state.currentStudent = null;
    state.qIndex = 0; state.selected = null; state.locked = false; state.score = 0;
    state.loginError = '';
    state.view = 'login';
    render();
  }

  // ---------- Quiz view ----------
  function selectOption(i){
    if(state.locked) return;
    stopTimer();
    state.selected = i;
    state.locked = true;
    var q = state.data.questions[state.qIndex];
    if(i === q.correct) state.score++;
    render();
  }

  function nextQuestion(){
    stopTimer();
    if(state.qIndex < state.data.questions.length - 1){
      state.qIndex++;
      state.selected = null;
      state.locked = false;
      render();
    } else {
      state.view = 'end';
      render();
    }
  }

  function restartQuiz(){
    stopTimer();
    state.qIndex = 0;
    state.selected = null;
    state.locked = false;
    state.score = 0;
    state.view = 'quiz';
    render();
  }

  async function submitScore(){
    if(!state.currentStudent){ toast('Please log in first'); return; }
    state.leaderboard.push({
      name: state.currentStudent.name,
      regNo: state.currentStudent.regNo,
      score: state.score,
      total: state.data.questions.length,
      date: new Date().toISOString()
    });
    var ok = await saveLeaderboard();
    if(ok){ toast('Saved!'); state.view = 'saved'; render(); }
  }

  // ---------- Admin ----------
  function openAdminLock(){
    stopTimer();
    state.view = 'adminLock';
    state.lockError = '';
    render();
  }

  function checkPassword(){
    var input = document.getElementById('passInput');
    var val = input && input.value;
    if(val === ADMIN_PASS || val === '1234' || val === 'admin123'){
      state.view = 'admin';
      state.adminTab = 'questions';
      state.editingId = null;
      state.editingStudentId = null;
      render();
    } else {
      state.lockError = 'Incorrect password';
      render();
    }
  }

  function exitAdmin(){
    state.view = state.currentStudent ? 'quiz' : 'login';
    state.qIndex = 0;
    state.selected = null;
    state.locked = false;
    state.score = 0;
    render();
  }

  function startEdit(id){
    state.editingId = id;
    render();
  }

  function startAdd(){
    state.editingId = 'NEW';
    render();
  }

  function cancelEdit(){
    state.editingId = null;
    render();
  }

  async function deleteQuestion(id){
    if(!confirm('Delete this question?')) return;
    state.data.questions = state.data.questions.filter(function(q){ return q.id !== id; });
    var ok = await saveData();
    if(ok) toast('Question deleted');
    render();
  }

  async function saveQuestionForm(id){
    var text = document.getElementById('f-text').value.trim();
    var optA = document.getElementById('f-optA').value.trim();
    var optB = document.getElementById('f-optB').value.trim();
    var optC = document.getElementById('f-optC').value.trim();
    var correct = parseInt(document.querySelector('input[name="f-correct"]:checked').value, 10);
    if(!text || !optA || !optB || !optC){ toast('Fill in all fields'); return; }

    if(id === 'NEW'){
      var newId = 'q' + Date.now();
      state.data.questions.push({ id: newId, text: text, options: [optA, optB, optC], correct: correct });
    } else {
      var q = state.data.questions.find(function(x){ return x.id === id; });
      if(q){ q.text = text; q.options = [optA, optB, optC]; q.correct = correct; }
    }
    var ok = await saveData();
    if(ok) toast('Saved');
    state.editingId = null;
    render();
  }

  function startEditStudent(id){
    state.editingStudentId = id;
    render();
  }

  function startAddStudent(){
    state.editingStudentId = 'NEW';
    render();
  }

  function cancelEditStudent(){
    state.editingStudentId = null;
    render();
  }

  async function deleteStudent(id){
    if(!confirm('Remove this student?')) return;
    state.data.students = state.data.students.filter(function(s){ return s.id !== id; });
    var ok = await saveData();
    if(ok) toast('Student removed');
    render();
  }

  async function saveStudentForm(id){
    var regNo = document.getElementById('fs-regno').value.trim();
    var name = document.getElementById('fs-name').value.trim();
    if(!regNo || !name){ toast('Fill in both fields'); return; }
    var dup = state.data.students.find(function(s){
      return s.regNo.trim().toLowerCase() === regNo.toLowerCase() && s.id !== id;
    });
    if(dup){ toast('That register number is already used'); return; }
    if(id === 'NEW'){
      state.data.students.push({ id: 's' + Date.now(), regNo: regNo, name: name });
    } else {
      var s = state.data.students.find(function(x){ return x.id === id; });
      if(s){ s.regNo = regNo; s.name = name; }
    }
    var ok = await saveData();
    if(ok) toast('Saved');
    state.editingStudentId = null;
    render();
  }

  async function saveSettingsForm(){
    var title = document.getElementById('s-title').value.trim();
    var subtitle = document.getElementById('s-subtitle').value.trim();
    var footer = document.getElementById('s-footer').value.trim();
    state.data.config.title = title || state.data.config.title;
    state.data.config.subtitle = subtitle || state.data.config.subtitle;
    state.data.config.footer = footer || state.data.config.footer;
    var timerVal = parseInt(document.getElementById('s-timer').value, 10);
    state.data.config.timePerQuestion = (timerVal && timerVal >= 3) ? timerVal : (state.data.config.timePerQuestion || 15);
    var fontVal = document.getElementById('s-font').value;
    state.data.config.fontPreset = FONT_PRESETS[fontVal] ? fontVal : (state.data.config.fontPreset || 'rounded');
    var ok = await saveData();
    if(ok) toast('Settings updated');
    render();
  }

  async function clearLeaderboard(){
    if(!confirm('Clear all results? This cannot be undone.')) return;
    state.leaderboard = [];
    var ok = await saveLeaderboard();
    if(ok) toast('Results cleared');
    render();
  }

  // ---------- Render ----------
  function applyFontPreset(){
    var preset = FONT_PRESETS[state.data.config.fontPreset] || FONT_PRESETS.rounded;
    document.documentElement.style.setProperty('--font-display', preset.display);
    document.documentElement.style.setProperty('--font-body', preset.body);
  }

  function render(){
    applyFontPreset();
    if(state.view === 'loading') return renderLoading();
    if(state.view === 'login') return renderLogin();
    if(state.view === 'quiz') return renderQuiz();
    if(state.view === 'end') return renderEnd();
    if(state.view === 'saved') return renderSaved();
    if(state.view === 'adminLock') return renderAdminLock();
    if(state.view === 'admin') return renderAdmin();
  }

  function renderLoading(){
    root.innerHTML =
      '<div class="shell"><div class="center-note">Loading quiz…</div></div>';
  }

  function brandOnly(){
    var c = state.data.config;
    return '<div class="brand"><h1>' + esc(c.title) + '</h1><p>' + esc(c.subtitle) + '</p></div>';
  }

  function brandBlock(){
    return brandOnly() + '<div class="quiz-title">Quiz Competition</div>';
  }

  function greetingLine(){
    if(!state.currentStudent) return '';
    return '<div style="text-align:center;color:rgba(255,255,255,0.85);font-weight:600;font-size:13.5px;margin:-10px 0 14px;">' +
      esc(state.currentStudent.name) + ' &middot; ' + esc(state.currentStudent.regNo) + '</div>';
  }

  function renderLogin(){
    root.innerHTML =
      '<div class="shell">' + brandOnly() +
      '<div class="card-stack" style="justify-content:center;">' +
      '<div class="end-card">' +
      '<h2>Student Login</h2>' +
      '<p style="margin:0;color:#555;font-size:14px;">Enter your register number to start the quiz</p>' +
      '<input type="text" id="regInput" placeholder="Register number (e.g. REG101)" maxlength="30" />' +
      (state.loginError ? '<div style="color:#c0392b;font-size:13px;margin-top:-6px;margin-bottom:8px;">' + esc(state.loginError) + '</div>' : '') +
      '<div class="end-actions">' +
      '<button class="btn btn-primary" id="loginBtn">Login</button>' +
      '</div></div></div>' +
      footerBlock() +
      '</div>';
    document.getElementById('loginBtn').addEventListener('click', attemptLogin);
    var regInput = document.getElementById('regInput');
    regInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') attemptLogin(); });
    regInput.focus();
    bindFooterLink();
  }

  function progressDots(){
    var total = state.data.questions.length;
    var html = '<div class="progress">';
    for(var i=0;i<total;i++){
      var cls = 'dot';
      if(i === state.qIndex) cls += ' active';
      else if(i < state.qIndex) cls += ' done';
      html += '<span class="' + cls + '"></span>';
    }
    html += '</div>';
    return html;
  }

  function renderQuiz(){
    var qs = state.data.questions;
    if(!qs.length){
      root.innerHTML =
        '<div class="shell">' + brandBlock() +
        '<div class="center-note">No questions yet. Ask an admin to add some.</div>' +
        footerBlock() + '</div>';
      bindFooterLink();
      return;
    }
    var q = qs[state.qIndex];
    var letters = ['A','B','C'];
    var optsHtml = q.options.map(function(opt, i){
      var cls = 'opt';
      if(state.locked){
        if(i === q.correct) cls += ' correct';
        else if(i === state.selected) cls += ' wrong';
        else cls += ' dim';
      }
      return '<button class="' + cls + '" data-i="' + i + '" ' + (state.locked ? 'disabled' : '') + '>' +
        '<span class="letter">' + letters[i] + '.</span><span>' + esc(opt) + '</span></button>';
    }).join('');

    root.innerHTML =
      '<div class="shell">' +
      brandBlock() +
      greetingLine() +
      progressDots() +
      '<div class="card-stack">' +
      '<div class="q-card-wrap">' +
      '<div class="q-pill">' + (state.qIndex+1) + '. ' + esc(q.text) + '</div>' +
      (!state.locked ? timerBadgeHtml() : '') +
      '</div>' +
      '<div class="options">' + optsHtml + '</div>' +
      (state.locked ? '<div class="next-wrap"><button class="btn btn-light" id="nextBtn">' +
        (state.qIndex === qs.length-1 ? 'See result' : 'Next question') + '</button></div>' : '') +
      '</div>' +
      footerBlock() +
      '</div>';

    Array.prototype.forEach.call(root.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-i'),10)); });
    });
    var nb = document.getElementById('nextBtn');
    if(nb) nb.addEventListener('click', nextQuestion);
    bindFooterLink();
    if(!state.locked) startTimer(); else stopTimer();
  }

  function footerBlock(){
    var c = state.data.config;
    return '<div class="footer"><div class="club">' + esc(c.footer) + '</div>' +
      '<a href="#" class="admin-link" id="adminLink">Admin</a></div>';
  }

  function bindFooterLink(){
    var a = document.getElementById('adminLink');
    if(a) a.addEventListener('click', function(e){ e.preventDefault(); openAdminLock(); });
  }

  function renderEnd(){
    var total = state.data.questions.length;
    root.innerHTML =
      '<div class="shell">' + brandBlock() + greetingLine() +
      '<div class="card-stack" style="justify-content:center;">' +
      '<div class="end-card">' +
      '<h2>Quiz complete!</h2>' +
      '<div class="score">' + state.score + ' / ' + total + '</div>' +
      '<div class="end-actions">' +
      '<button class="btn btn-primary" id="submitScoreBtn">Save result</button>' +
      '<button class="btn btn-light" id="restartBtn">Play again</button>' +
      '<button class="btn btn-outline" id="logoutBtn">Log out</button>' +
      '</div></div></div>' +
      footerBlock() +
      '</div>';
    document.getElementById('submitScoreBtn').addEventListener('click', submitScore);
    document.getElementById('restartBtn').addEventListener('click', restartQuiz);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    bindFooterLink();
  }

  function renderSaved(){
    var total = state.data.questions.length;
    root.innerHTML =
      '<div class="shell">' + brandBlock() + greetingLine() +
      '<div class="card-stack" style="justify-content:center;">' +
      '<div class="end-card">' +
      '<h2>Result saved</h2>' +
      '<div class="score">' + state.score + ' / ' + total + '</div>' +
      '<div class="end-actions">' +
      '<button class="btn btn-primary" id="restartBtn2">Play again</button>' +
      '<button class="btn btn-outline" id="logoutBtn2">Log out</button>' +
      '</div></div></div>' +
      footerBlock() +
      '</div>';
    document.getElementById('restartBtn2').addEventListener('click', restartQuiz);
    document.getElementById('logoutBtn2').addEventListener('click', logout);
    bindFooterLink();
  }

  function renderAdminLock(){
    root.innerHTML =
      '<div class="overlay"><div class="overlay-inner">' +
      '<div class="lock-box">' +
      '<h3>Admin access</h3>' +
      '<p style="color:rgba(255,255,255,0.6);font-size:13.5px;margin:0;">Enter the admin password to manage questions and results.</p>' +
      '<input type="password" id="passInput" placeholder="Password (e.g. skssf2026)" />' +
      '<div class="lock-err">' + esc(state.lockError) + '</div>' +
      '<div class="end-actions" style="justify-content:center;">' +
      '<button class="btn btn-primary" id="unlockBtn">Enter</button>' +
      '<button class="btn btn-ghost" id="cancelLockBtn">Cancel</button>' +
      '</div></div></div></div>';
    document.getElementById('unlockBtn').addEventListener('click', checkPassword);
    document.getElementById('cancelLockBtn').addEventListener('click', function(){ state.view = state.currentStudent ? 'quiz' : 'login'; render(); });
    document.getElementById('passInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkPassword(); });
    document.getElementById('passInput').focus();
  }

  function questionFormHtml(q){
    var isNew = !q;
    q = q || { text:'', options:['','',''], correct:0 };
    var letters = ['A','B','C'];
    var radios = [0,1,2].map(function(i){
      return '<div class="radio-row"><input type="radio" name="f-correct" value="'+i+'" id="f-correct-'+i+'" ' + (q.correct===i?'checked':'') + '>' +
        '<label for="f-correct-'+i+'">Correct answer is ' + letters[i] + '</label></div>';
    }).join('');
    return (
      '<div class="form-box">' +
      '<label>Question</label><textarea id="f-text" rows="2">' + esc(q.text) + '</textarea>' +
      '<label>Option A</label><input type="text" id="f-optA" value="' + esc(q.options[0]) + '">' +
      '<label>Option B</label><input type="text" id="f-optB" value="' + esc(q.options[1]) + '">' +
      '<label>Option C</label><input type="text" id="f-optC" value="' + esc(q.options[2]) + '">' +
      '<label>Correct answer</label>' + radios +
      '<div class="form-actions">' +
      '<button class="btn btn-primary" id="saveQBtn">' + (isNew ? 'Add question' : 'Save changes') + '</button>' +
      '<button class="btn btn-ghost" id="cancelQBtn">Cancel</button>' +
      '</div></div>'
    );
  }

  function studentFormHtml(s){
    var isNew = !s;
    s = s || { regNo:'', name:'' };
    return (
      '<div class="form-box">' +
      '<label>Register number</label><input type="text" id="fs-regno" value="' + esc(s.regNo) + '">' +
      '<label>Name</label><input type="text" id="fs-name" value="' + esc(s.name) + '">' +
      '<div class="form-actions">' +
      '<button class="btn btn-primary" id="saveStuBtn">' + (isNew ? 'Add student' : 'Save changes') + '</button>' +
      '<button class="btn btn-ghost" id="cancelStuBtn">Cancel</button>' +
      '</div></div>'
    );
  }

  function renderAdmin(){
    var html = '<div class="overlay"><div class="overlay-inner">' +
      '<div class="admin-header"><h2>Admin panel</h2>' +
      '<button class="btn btn-ghost" id="exitAdminBtn" style="padding:8px 16px;">Exit</button></div>' +
      '<div class="tabs">' +
      '<button class="tab ' + (state.adminTab==='questions'?'active':'') + '" data-tab="questions">Questions</button>' +
      '<button class="tab ' + (state.adminTab==='students'?'active':'') + '" data-tab="students">Students</button>' +
      '<button class="tab ' + (state.adminTab==='leaderboard'?'active':'') + '" data-tab="leaderboard">Results</button>' +
      '<button class="tab ' + (state.adminTab==='settings'?'active':'') + '" data-tab="settings">Settings</button>' +
      '</div>';

    if(state.adminTab === 'questions'){
      html += '<p style="color:rgba(255,255,255,0.55);font-size:13px;margin-top:0;">Visible to everyone who opens this quiz.</p>';
      state.data.questions.forEach(function(q, idx){
        var letters = ['A','B','C'];
        if(state.editingId === q.id){
          html += questionFormHtml(q);
        } else {
          html += '<div class="q-item"><div class="qt">' + (idx+1) + '. ' + esc(q.text) + '</div>';
          q.options.forEach(function(opt, i){
            html += '<div class="opt-row ' + (i===q.correct?'correct':'') + '">' + letters[i] + '. ' + esc(opt) + (i===q.correct?' ✓':'') + '</div>';
          });
          html += '<div class="row-actions">' +
            '<button class="mini-btn mini-edit" data-edit="' + q.id + '">Edit</button>' +
            '<button class="mini-btn mini-del" data-del="' + q.id + '">Delete</button>' +
            '</div></div>';
        }
      });
      if(state.editingId === 'NEW'){
        html += questionFormHtml(null);
      } else {
        html += '<button class="btn btn-primary" id="addQBtn" style="width:100%;margin-top:8px;">+ Add question</button>';
      }
    }

    if(state.adminTab === 'students'){
      html += '<p style="color:rgba(255,255,255,0.55);font-size:13px;margin-top:0;">Only these register numbers can log in to the quiz.</p>';
      if(!state.data.students.length && state.editingStudentId === null){
        html += '<div class="empty-note">No students added yet.</div>';
      }
      state.data.students.forEach(function(s){
        if(state.editingStudentId === s.id){
          html += studentFormHtml(s);
        } else {
          html += '<div class="q-item"><div class="qt">' + esc(s.name) + '</div>' +
            '<div class="opt-row">Reg No: ' + esc(s.regNo) + '</div>' +
            '<div class="row-actions">' +
            '<button class="mini-btn mini-edit" data-edit-stu="' + s.id + '">Edit</button>' +
            '<button class="mini-btn mini-del" data-del-stu="' + s.id + '">Delete</button>' +
            '</div></div>';
        }
      });
      if(state.editingStudentId === 'NEW'){
        html += studentFormHtml(null);
      } else {
        html += '<button class="btn btn-primary" id="addStuBtn" style="width:100%;margin-top:8px;">+ Add student</button>';
      }
    }

    if(state.adminTab === 'leaderboard'){
      if(!state.leaderboard.length){
        html += '<div class="empty-note">No results yet. Scores will appear here once people finish the quiz.</div>';
      } else {
        var rows = state.leaderboard.slice().sort(function(a,b){ return b.score - a.score; });
        html += '<table class="lb"><thead><tr><th>Name</th><th>Reg No</th><th>Score</th><th>Date</th></tr></thead><tbody>';
        rows.forEach(function(r){
          var d = new Date(r.date);
          html += '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.regNo || '-') + '</td><td>' + r.score + '/' + r.total + '</td><td>' + d.toLocaleDateString() + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '<button class="btn btn-ghost" id="clearLbBtn" style="margin-top:16px;">Clear all results</button>';
      }
    }

    if(state.adminTab === 'settings'){
      var c = state.data.config;
      var fontOptions = Object.keys(FONT_PRESETS).map(function(key){
        var p = FONT_PRESETS[key];
        var sel = (c.fontPreset || 'rounded') === key ? 'selected' : '';
        return '<option value="' + key + '" ' + sel + '>' + esc(p.label) + '</option>';
      }).join('');
      html += '<div class="form-box">' +
        '<label>Title</label><input type="text" id="s-title" value="' + esc(c.title) + '">' +
        '<label>Subtitle</label><input type="text" id="s-subtitle" value="' + esc(c.subtitle) + '">' +
        '<label>Footer text</label><input type="text" id="s-footer" value="' + esc(c.footer) + '">' +
        '<label>Seconds per question</label><input type="text" id="s-timer" value="' + esc(c.timePerQuestion || 15) + '">' +
        '<label>Font style</label>' +
        '<select id="s-font">' + fontOptions + '</select>' +
        '<div class="form-actions"><button class="btn btn-primary" id="saveSettingsBtn">Save settings</button></div>' +
        '</div>';
    }

    html += '</div></div>';
    root.innerHTML = html;

    document.getElementById('exitAdminBtn').addEventListener('click', exitAdmin);
    Array.prototype.forEach.call(root.querySelectorAll('.tab'), function(t){
      t.addEventListener('click', function(){ state.adminTab = t.getAttribute('data-tab'); state.editingId=null; state.editingStudentId=null; render(); });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){ startEdit(b.getAttribute('data-edit')); });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){ deleteQuestion(b.getAttribute('data-del')); });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-edit-stu]'), function(b){
      b.addEventListener('click', function(){ startEditStudent(b.getAttribute('data-edit-stu')); });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-del-stu]'), function(b){
      b.addEventListener('click', function(){ deleteStudent(b.getAttribute('data-del-stu')); });
    });
    var addBtn = document.getElementById('addQBtn');
    if(addBtn) addBtn.addEventListener('click', startAdd);
    var saveQBtn = document.getElementById('saveQBtn');
    if(saveQBtn) saveQBtn.addEventListener('click', function(){ saveQuestionForm(state.editingId); });
    var cancelQBtn = document.getElementById('cancelQBtn');
    if(cancelQBtn) cancelQBtn.addEventListener('click', cancelEdit);
    var addStuBtn = document.getElementById('addStuBtn');
    if(addStuBtn) addStuBtn.addEventListener('click', startAddStudent);
    var saveStuBtn = document.getElementById('saveStuBtn');
    if(saveStuBtn) saveStuBtn.addEventListener('click', function(){ saveStudentForm(state.editingStudentId); });
    var cancelStuBtn = document.getElementById('cancelStuBtn');
    if(cancelStuBtn) cancelStuBtn.addEventListener('click', cancelEditStudent);
    var clearLbBtn = document.getElementById('clearLbBtn');
    if(clearLbBtn) clearLbBtn.addEventListener('click', clearLeaderboard);
    var saveSettingsBtn = document.getElementById('saveSettingsBtn');
    if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', saveSettingsForm);
  }

  loadAll();
})();
</script>
</body>
</html>
